server:
  port: 8080

spring:
  application:
    name: institution-portfolio
  jackson:
    default-property-inclusion: always

portfolio:
  grants-base-url: https://www.ebi.ac.uk/europepmc/GristAPI/rest
  articles-base-url: https://www.ebi.ac.uk/europepmc/webservices/rest
  connect-timeout: 3s
  read-timeout: 10s
  # Global cap on simultaneous Articles API calls made by this service.
  max-concurrent-lookups: 4
  # Total time one request waits for all of its publication lookups.
  lookup-deadline: 25s
