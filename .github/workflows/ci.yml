name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        run: mvn -B test
      - name: Docker build
        run: docker build -t institution-portfolio .
      - name: Smoke test container
        run: |
          docker run -d --name app -p 8080:8080 institution-portfolio
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' 'localhost:8080/institution-portfolio?limit=99&institution=x' || true)
            [ "$code" = "400" ] && echo "container up, validation OK" && exit 0
            sleep 2
          done
          docker logs app
          exit 1
